<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Problem-Solving Pipeline</title>
  <desc id="desc">Reproduce, inspect, understand, fix, test, verify, and contribute.</desc>
  <style>
    .bg{fill:#f6f8fa;stroke:#d0d7de}.card{fill:#ffffff;stroke:#d0d7de}.text{fill:#24292f}.muted{fill:#57606a}.accent{fill:#0969da}.accentText{fill:#0969da}.line{stroke:#0969da}
    @media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.card{fill:#0d1117;stroke:#30363d}.text{fill:#f0f6fc}.muted{fill:#8b949e}.accent{fill:#58a6ff}.accentText{fill:#58a6ff}.line{stroke:#58a6ff}}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="accent"/></marker>
  </defs>

  <rect x="1" y="1" width="998" height="428" rx="16" class="bg"/>
  <rect x="1" y="1" width="5" height="428" rx="2.5" class="accent"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
    <text x="34" y="43" class="text" font-size="21" font-weight="700">engineering_pipeline()</text>
    <text x="34" y="68" class="muted" font-size="13">small changes, strong evidence, clear reasoning</text>

    <rect x="34" y="91" width="932" height="46" rx="10" class="card"/>
    <text x="500" y="119" text-anchor="middle" class="accentText" font-size="12" font-weight="700">understanding &gt; guessing   ·   tests &gt; assumptions   ·   clarity &gt; cleverness</text>

    <g>
      <g transform="translate(34 162)">
        <rect width="210" height="96" rx="12" class="card"/>
        <circle cx="28" cy="28" r="14" class="accent"/>
        <text x="28" y="33" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">01</text>
        <text x="20" y="62" class="text" font-size="14" font-weight="700">REPRODUCE</text>
        <text x="20" y="82" class="muted" font-size="11">make the problem fail reliably</text>
      </g>
      <path d="M248 210 H276" class="line" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>

      <g transform="translate(280 162)">
        <rect width="210" height="96" rx="12" class="card"/>
        <circle cx="28" cy="28" r="14" class="accent"/>
        <text x="28" y="33" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">02</text>
        <text x="20" y="62" class="text" font-size="14" font-weight="700">INSPECT</text>
        <text x="20" y="82" class="muted" font-size="11">trace behavior and boundaries</text>
      </g>
      <path d="M494 210 H522" class="line" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>

      <g transform="translate(526 162)">
        <rect width="210" height="96" rx="12" class="card"/>
        <circle cx="28" cy="28" r="14" class="accent"/>
        <text x="28" y="33" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">03</text>
        <text x="20" y="62" class="text" font-size="14" font-weight="700">UNDERSTAND</text>
        <text x="20" y="82" class="muted" font-size="11">identify the root cause</text>
      </g>
      <path d="M740 210 H768" class="line" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>

      <g transform="translate(772 162)">
        <rect width="194" height="96" rx="12" class="card"/>
        <circle cx="28" cy="28" r="14" class="accent"/>
        <text x="28" y="33" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">04</text>
        <text x="20" y="62" class="text" font-size="14" font-weight="700">FIX</text>
        <text x="20" y="82" class="muted" font-size="11">smallest correct change</text>
      </g>
    </g>

    <g>
      <g transform="translate(157 292)">
        <rect width="210" height="96" rx="12" class="card"/>
        <circle cx="28" cy="28" r="14" class="accent"/>
        <text x="28" y="33" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">05</text>
        <text x="20" y="62" class="text" font-size="14" font-weight="700">TEST</text>
        <text x="20" y="82" class="muted" font-size="11">lock the regression down</text>
      </g>
      <path d="M371 340 H399" class="line" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>

      <g transform="translate(403 292)">
        <rect width="210" height="96" rx="12" class="card"/>
        <circle cx="28" cy="28" r="14" class="accent"/>
        <text x="28" y="33" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">06</text>
        <text x="20" y="62" class="text" font-size="14" font-weight="700">VERIFY</text>
        <text x="20" y="82" class="muted" font-size="11">preserve existing behavior</text>
      </g>
      <path d="M617 340 H645" class="line" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>

      <g transform="translate(649 292)">
        <rect width="210" height="96" rx="12" class="card"/>
        <circle cx="28" cy="28" r="14" class="accent"/>
        <text x="28" y="33" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">07</text>
        <text x="20" y="62" class="text" font-size="14" font-weight="700">CONTRIBUTE</text>
        <text x="20" y="82" class="muted" font-size="11">open a focused pull request</text>
      </g>
    </g>

    <text x="500" y="414" text-anchor="middle" class="muted" font-size="11">The goal is not the biggest patch — it is the clearest correct one.</text>
  </g>
</svg>