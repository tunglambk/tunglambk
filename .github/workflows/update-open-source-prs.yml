name: Update open-source profile

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Refresh notable merges and contribution chart
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const username = 'tunglambk';
            const startMarker = '<!-- OSS-NOTABLE:START -->';
            const endMarker = '<!-- OSS-NOTABLE:END -->';

            const searchQuery = `
              query ($cursor: String) {
                search(query: "is:pr author:${username} -user:${username}", type: ISSUE, first: 100, after: $cursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    ... on PullRequest {
                      number
                      title
                      url
                      merged
                      mergedAt
                      repository { nameWithOwner stargazerCount }
                    }
                  }
                }
              }
            `;

            const pulls = [];
            let cursor = null;

            while (true) {
              const data = cursor
                ? await github.graphql(searchQuery, { cursor })
                : await github.graphql(searchQuery);

              for (const node of data.search.nodes) {
                if (!node.repository) continue;

                const owner = node.repository.nameWithOwner.split('/')[0];
                if (owner.toLowerCase() === username.toLowerCase()) continue;

                pulls.push({
                  repo: node.repository.nameWithOwner,
                  stars: node.repository.stargazerCount || 0,
                  number: node.number,
                  title: String(node.title || '').replace(/[\\[\]]/g, ch => `\\${ch}`).replace(/\|/g, '\\|'),
                  url: node.url,
                  merged: Boolean(node.merged),
                  mergedAt: node.mergedAt || '',
                });
              }

              if (!data.search.pageInfo.hasNextPage) break;
              cursor = data.search.pageInfo.endCursor;
            }

            const repoNames = new Map();

            for (const pr of pulls) {
              if (!pr.merged) continue;

              const entry = repoNames.get(pr.repo) || { repo: pr.repo, stars: 0, merged: 0 };
              entry.merged += 1;
              entry.stars = Math.max(entry.stars, pr.stars);
              repoNames.set(pr.repo, entry);
            }

            const repos = [...repoNames.values()];
            const mergedTotal = repos.reduce((sum, repo) => sum + repo.merged, 0);

            const byMerges = [...repos].sort(
              (a, b) => b.merged - a.merged || b.stars - a.stars || a.repo.localeCompare(b.repo),
            );

            // Repositories where this account has landed more than one pull request.
            const mostMerged = byMerges.filter(repo => repo.merged >= 2).slice(0, 8);

            // Newest merge per high-star upstream, so every notable project shows a concrete PR.
            const latestPerRepo = new Map();

            for (const pr of pulls) {
              if (!pr.merged) continue;

              const current = latestPerRepo.get(pr.repo);
              if (!current || pr.mergedAt > current.mergedAt) latestPerRepo.set(pr.repo, pr);
            }

            const highProfile = [...latestPerRepo.values()]
              .filter(pr => pr.stars >= 1000)
              .sort((a, b) => b.stars - a.stars || b.mergedAt.localeCompare(a.mergedAt))
              .slice(0, 6);

            const formatStars = stars => (stars >= 1000
              ? `${(stars / 1000).toFixed(1).replace(/\.0$/, '')}k`
              : String(stars));

            const entryLine = repo =>
              `- **[${repo.repo}](https://github.com/${repo.repo})** — ★ ${formatStars(repo.stars)} · **${repo.merged} PR${repo.merged === 1 ? '' : 's'} merged**`;

            const mergeLine = pr =>
              `- **[${pr.repo}](https://github.com/${pr.repo})** ★ ${formatStars(pr.stars)} — [${pr.title}](${pr.url})`;

            const sections = [];

            if (highProfile.length) {
              sections.push(['**High-profile projects**', '', ...highProfile.map(mergeLine)].join('\n'));
            }

            if (mostMerged.length) {
              sections.push(['**Most merges**', '', ...mostMerged.map(entryLine)].join('\n'));
            }

            const generated = sections.length
              ? sections.join('\n\n')
              : '_No merged upstream pull requests yet._';

            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');
            const start = readme.indexOf(startMarker);
            const end = readme.indexOf(endMarker);

            if (start === -1 || end === -1 || end < start) {
              core.setFailed('README markers for the notable merges section were not found.');
              return;
            }

            const before = readme.slice(0, start + startMarker.length);
            const after = readme.slice(end);
            fs.writeFileSync(readmePath, `${before}\n${generated}\n${after}`);

            const rows = byMerges.slice(0, 10);
            const max = Math.max(1, ...rows.map(repo => repo.merged));
            const rowHeight = 44;
            const height = 118 + rows.length * rowHeight + 24;
            const barX = 330;
            const barMaxWidth = 500;

            const escapeXml = value => String(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;');

            const rowSvg = rows.map((repo, index) => {
              const y = 109 + index * rowHeight;
              const width = Math.max(18, Math.round((repo.merged / max) * barMaxWidth));
              const labelX = barX + width + 12;
              return `
                <rect x="${barX}" y="${y}" width="${barMaxWidth}" height="22" rx="6" class="track"/>
                <text x="30" y="${y + 16}" class="text" font-size="13">${escapeXml(repo.repo)}</text>
                <rect x="${barX}" y="${y}" width="${width}" height="22" rx="6" class="accent"/>
                <text x="${Math.min(labelX, 850)}" y="${y + 16}" class="text" font-size="13" font-weight="700">${repo.merged}</text>`;
            }).join('');

            const chart = `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="${height}" viewBox="0 0 900 ${height}" role="img" aria-labelledby="title desc">
              <title id="title">Open Source Contribution Footprint</title>
              <desc id="desc">${mergedTotal} merged pull requests across ${repos.length} upstream repositories.</desc>
              <style>
                .bg{fill:#f6f8fa;stroke:#d0d7de}.card{fill:#ffffff;stroke:#d0d7de}.track{fill:#eaeef2}.text{fill:#24292f}.muted{fill:#57606a}.accent{fill:#0969da}.accentText{fill:#0969da}
                @media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.card{fill:#0d1117;stroke:#30363d}.track{fill:#21262d}.text{fill:#f0f6fc}.muted{fill:#8b949e}.accent{fill:#58a6ff}.accentText{fill:#58a6ff}}
              </style>
              <rect x="1" y="1" width="898" height="${height - 2}" rx="16" class="bg"/>
              <rect x="1" y="1" width="5" height="${height - 2}" rx="2.5" class="accent"/>
              <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace">
                <text x="30" y="46" class="text" font-size="21" font-weight="700">Open Source Contribution Footprint</text>
                <text x="30" y="71" class="muted" font-size="13">Merged pull requests grouped by upstream repository</text>
                <rect x="686" y="22" width="184" height="54" rx="10" class="card"/>
                <text x="702" y="45" class="accentText" font-size="14" font-weight="700">${mergedTotal} merged PRs</text>
                <text x="702" y="65" class="muted" font-size="12">across ${repos.length} projects</text>
                ${rowSvg}
              </g>
            </svg>`;

            fs.writeFileSync('oss-contributions.svg', chart);

      - name: Commit profile when it changed
        shell: bash
        run: |
          if git diff --quiet -- README.md oss-contributions.svg; then
            echo "Profile is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md oss-contributions.svg
          git commit -m "docs: refresh open-source profile"
          git push
