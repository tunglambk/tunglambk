name: Update contribution history

on:
  schedule:
    # Offset from :00 to avoid the busiest period for scheduled workflows.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Refresh contribution summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const username = 'tunglambk';
            const startMarker = '<!-- OSS-NOTABLE:START -->';
            const endMarker = '<!-- OSS-NOTABLE:END -->';

            // The summary is all-time. Curated examples elsewhere in the README
            // stay unchanged, and only work merged into external repos is counted.
            const searchQuery = `
              query ($cursor: String) {
                search(query: "is:pr is:merged author:${username} -user:${username}", type: ISSUE, first: 100, after: $cursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    ... on PullRequest {
                      merged
                      repository { nameWithOwner }
                    }
                  }
                }
              }
            `;

            const repos = new Set();
            let mergedTotal = 0;
            let cursor = null;

            while (true) {
              const data = cursor
                ? await github.graphql(searchQuery, { cursor })
                : await github.graphql(searchQuery);

              for (const node of data.search.nodes) {
                if (!node.merged || !node.repository) continue;

                const repo = node.repository.nameWithOwner;
                const owner = repo.split('/')[0];
                if (owner.toLowerCase() === username.toLowerCase()) continue;

                mergedTotal += 1;
                repos.add(repo);
              }

              if (!data.search.pageInfo.hasNextPage) break;
              cursor = data.search.pageInfo.endCursor;
            }

            const generated = mergedTotal
              ? `${mergedTotal} merged pull request${mergedTotal === 1 ? '' : 's'} across ${repos.size} upstream repositor${repos.size === 1 ? 'y' : 'ies'} (all-time).`
              : '_No upstream contributions to show yet._';

            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');
            const start = readme.indexOf(startMarker);
            const end = readme.indexOf(endMarker);

            if (start === -1 || end === -1 || end < start) {
              core.setFailed('README markers for the contribution summary were not found.');
              return;
            }

            const before = readme.slice(0, start + startMarker.length);
            const after = readme.slice(end);
            fs.writeFileSync(readmePath, `${before}\n${generated}\n${after}`);

      - name: Commit summary when it changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Contribution history is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh contribution history"
          git push
