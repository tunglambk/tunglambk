<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Exploration and Collaboration Map</title>
  <desc id="desc">A visual map of AI systems, Python engineering, open source, and collaboration interests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <linearGradient id="core" x1="0" x2="1"><stop offset="0%" stop-color="#2f81f7"/><stop offset="100%" stop-color="#a371f7"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="998" height="428" rx="20" fill="url(#bg)" stroke="#30363d"/>
  <text x="40" y="46" fill="#f0f6fc" font-size="22" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">where_i_am_heading()</text>
  <text x="40" y="70" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the intersection I want to keep exploring and contributing to</text>

  <g stroke="#30363d" stroke-width="1.5">
    <line x1="500" y1="226" x2="190" y2="140"/>
    <line x1="500" y1="226" x2="810" y2="140"/>
    <line x1="500" y1="226" x2="190" y2="320"/>
    <line x1="500" y1="226" x2="810" y2="320"/>
  </g>

  <circle cx="500" cy="226" r="76" fill="#161b22" stroke="url(#core)" stroke-width="3" filter="url(#glow)"/>
  <text x="500" y="216" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AI × SOFTWARE</text>
  <text x="500" y="241" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ENGINEERING</text>
  <text x="500" y="265" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">research → systems → users</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(70,92)">
      <rect width="250" height="105" rx="16" fill="#161b22" stroke="#2f81f7"/>
      <text x="22" y="30" fill="#58a6ff" font-size="15" font-weight="700">🤖 AI SYSTEMS</text>
      <text x="22" y="55" fill="#c9d1d9" font-size="12">LLM architecture · RAG</text>
      <text x="22" y="75" fill="#c9d1d9" font-size="12">agents · evaluation</text>
      <text x="22" y="95" fill="#8b949e" font-size="10">reliable production AI</text>
    </g>

    <g transform="translate(680,92)">
      <rect width="250" height="105" rx="16" fill="#161b22" stroke="#3fb950"/>
      <text x="22" y="30" fill="#7ee787" font-size="15" font-weight="700">🐍 PYTHON ENGINEERING</text>
      <text x="22" y="55" fill="#c9d1d9" font-size="12">framework internals · APIs</text>
      <text x="22" y="75" fill="#c9d1d9" font-size="12">testing · debugging</text>
      <text x="22" y="95" fill="#8b949e" font-size="10">clean, maintainable systems</text>
    </g>

    <g transform="translate(70,275)">
      <rect width="250" height="105" rx="16" fill="#161b22" stroke="#d29922"/>
      <text x="22" y="30" fill="#e3b341" font-size="15" font-weight="700">🌱 OPEN SOURCE</text>
      <text x="22" y="55" fill="#c9d1d9" font-size="12">real issues · real codebases</text>
      <text x="22" y="75" fill="#c9d1d9" font-size="12">small fixes · regression tests</text>
      <text x="22" y="95" fill="#8b949e" font-size="10">learn from maintainers</text>
    </g>

    <g transform="translate(680,275)">
      <rect width="250" height="105" rx="16" fill="#161b22" stroke="#a371f7"/>
      <text x="22" y="30" fill="#d2a8ff" font-size="15" font-weight="700">🤝 COLLABORATE</text>
      <text x="22" y="55" fill="#c9d1d9" font-size="12">AI / LLM tooling</text>
      <text x="22" y="75" fill="#c9d1d9" font-size="12">hard debugging problems</text>
      <text x="22" y="95" fill="#8b949e" font-size="10">developer infrastructure</text>
    </g>
  </g>
</svg>