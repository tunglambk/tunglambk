<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Exploration and Collaboration Map</title>
  <desc id="desc">A visual map of AI systems, Python engineering, open source, and collaboration interests.</desc>
  <style>
    .bg{fill:#f6f8fa;stroke:#d0d7de}.card{fill:#ffffff;stroke:#d0d7de}.text{fill:#24292f}.muted{fill:#57606a}.accentText{fill:#0969da}.accentStroke{stroke:#0969da}.link{stroke:#afb8c1}
    @media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.card{fill:#0d1117;stroke:#30363d}.text{fill:#f0f6fc}.muted{fill:#8b949e}.accentText{fill:#58a6ff}.accentStroke{stroke:#58a6ff}.link{stroke:#30363d}}
  </style>

  <rect x="1" y="1" width="998" height="428" rx="16" class="bg"/>
  <rect x="1" y="1" width="5" height="428" rx="2.5" fill="#0969da"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
    <text x="34" y="43" class="text" font-size="21" font-weight="700">where_i_am_heading()</text>
    <text x="34" y="68" class="muted" font-size="13">the intersection I want to keep exploring and contributing to</text>

    <g class="link" stroke-width="1.5">
      <line x1="500" y1="230" x2="290" y2="145"/>
      <line x1="500" y1="230" x2="710" y2="145"/>
      <line x1="500" y1="230" x2="290" y2="320"/>
      <line x1="500" y1="230" x2="710" y2="320"/>
    </g>

    <circle cx="500" cy="230" r="74" class="card accentStroke" stroke-width="2"/>
    <text x="500" y="216" text-anchor="middle" class="text" font-size="18" font-weight="700">AI × SOFTWARE</text>
    <text x="500" y="241" text-anchor="middle" class="accentText" font-size="14" font-weight="700">ENGINEERING</text>
    <text x="500" y="265" text-anchor="middle" class="muted" font-size="11">research → systems → users</text>

    <g transform="translate(52 95)">
      <rect width="290" height="116" rx="12" class="card"/>
      <text x="20" y="32" class="text" font-size="15" font-weight="700">AI SYSTEMS</text>
      <text x="20" y="58" class="muted" font-size="12">LLM architecture · RAG · agents</text>
      <text x="20" y="79" class="muted" font-size="12">evaluation · reliable production AI</text>
      <text x="20" y="101" class="accentText" font-size="10" font-weight="700">research → working systems</text>
    </g>

    <g transform="translate(658 95)">
      <rect width="290" height="116" rx="12" class="card"/>
      <text x="20" y="32" class="text" font-size="15" font-weight="700">PYTHON ENGINEERING</text>
      <text x="20" y="58" class="muted" font-size="12">framework internals · APIs</text>
      <text x="20" y="79" class="muted" font-size="12">testing · debugging · clean design</text>
      <text x="20" y="101" class="accentText" font-size="10" font-weight="700">maintainable engineering</text>
    </g>

    <g transform="translate(52 275)">
      <rect width="290" height="116" rx="12" class="card"/>
      <text x="20" y="32" class="text" font-size="15" font-weight="700">OPEN SOURCE</text>
      <text x="20" y="58" class="muted" font-size="12">real issues · real codebases</text>
      <text x="20" y="79" class="muted" font-size="12">focused fixes · regression tests</text>
      <text x="20" y="101" class="accentText" font-size="10" font-weight="700">learn from maintainers</text>
    </g>

    <g transform="translate(658 275)">
      <rect width="290" height="116" rx="12" class="card"/>
      <text x="20" y="32" class="text" font-size="15" font-weight="700">COLLABORATE</text>
      <text x="20" y="58" class="muted" font-size="12">AI / LLM tooling · Python projects</text>
      <text x="20" y="79" class="muted" font-size="12">hard debugging · developer infra</text>
      <text x="20" y="101" class="accentText" font-size="10" font-weight="700">useful engineering problems</text>
    </g>
  </g>
</svg>