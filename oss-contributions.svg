<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Open Source Pull Requests by Repository</title>
  <desc id="desc">11 public pull requests across 7 open-source repositories. Django Ninja has 5; tox, PDM, pyproject-hooks, Pygments, FastHTML, and DeepEval have 1 each.</desc>
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="428" rx="18" fill="#0d1117" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
    <text x="32" y="48" fill="#f0f6fc" font-size="22" font-weight="700">Open Source Contribution Footprint</text>
    <text x="32" y="74" fill="#8b949e" font-size="13">Public pull requests grouped by upstream repository</text>

    <rect x="700" y="28" width="168" height="44" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="718" y="55" fill="#7ee787" font-size="14" font-weight="700">11 PRs</text>
    <text x="778" y="55" fill="#8b949e" font-size="13">· 7 projects</text>

    <g fill="#21262d">
      <rect x="286" y="109" width="540" height="22" rx="6"/>
      <rect x="286" y="153" width="540" height="22" rx="6"/>
      <rect x="286" y="197" width="540" height="22" rx="6"/>
      <rect x="286" y="241" width="540" height="22" rx="6"/>
      <rect x="286" y="285" width="540" height="22" rx="6"/>
      <rect x="286" y="329" width="540" height="22" rx="6"/>
      <rect x="286" y="373" width="540" height="22" rx="6"/>
    </g>

    <g fill="#c9d1d9" font-size="14">
      <text x="32" y="125">vitalik/django-ninja</text>
      <text x="32" y="169">tox-dev/tox</text>
      <text x="32" y="213">pdm-project/pdm</text>
      <text x="32" y="257">pypa/pyproject-hooks</text>
      <text x="32" y="301">pygments/pygments</text>
      <text x="32" y="345">AnswerDotAI/fasthtml</text>
      <text x="32" y="389">confident-ai/deepeval</text>
    </g>

    <g fill="url(#bar)" filter="url(#shadow)">
      <rect x="286" y="109" width="540" height="22" rx="6"/>
      <rect x="286" y="153" width="108" height="22" rx="6"/>
      <rect x="286" y="197" width="108" height="22" rx="6"/>
      <rect x="286" y="241" width="108" height="22" rx="6"/>
      <rect x="286" y="285" width="108" height="22" rx="6"/>
      <rect x="286" y="329" width="108" height="22" rx="6"/>
      <rect x="286" y="373" width="108" height="22" rx="6"/>
    </g>

    <g fill="#f0f6fc" font-size="13" font-weight="700">
      <text x="838" y="125">5</text>
      <text x="406" y="169">1</text>
      <text x="406" y="213">1</text>
      <text x="406" y="257">1</text>
      <text x="406" y="301">1</text>
      <text x="406" y="345">1</text>
